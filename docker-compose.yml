name: marketflow

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: marketflow_foundation
      POSTGRES_USER: ${MARKETFLOW_POSTGRES_USER:-marketflow_local}
      POSTGRES_PASSWORD: ${MARKETFLOW_POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  identity-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketflow_identity
      POSTGRES_USER: ${IDENTITY_DATABASE_USER:-identity_app}
      POSTGRES_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:-local-development-only}
    ports:
      - "5433:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  seller-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketflow_seller
      POSTGRES_USER: ${SELLER_DATABASE_USER:-seller_app}
      POSTGRES_PASSWORD: ${SELLER_DATABASE_PASSWORD:-local-development-only}
    ports:
      - "5434:5432"
    volumes:
      - seller-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  catalog-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketflow_catalog
      POSTGRES_USER: ${CATALOG_DATABASE_USER:-catalog_app}
      POSTGRES_PASSWORD: ${CATALOG_DATABASE_PASSWORD:-local-development-only}
    ports: ["5435:5432"]
    volumes: [catalog-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  inventory-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketflow_inventory
      POSTGRES_USER: ${INVENTORY_DATABASE_USER:-inventory_app}
      POSTGRES_PASSWORD: ${INVENTORY_DATABASE_PASSWORD:-local-development-only}
    ports: ["5436:5432"]
    volumes: [inventory-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  search-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketflow_search
      POSTGRES_USER: ${SEARCH_DATABASE_USER:-search_app}
      POSTGRES_PASSWORD: ${SEARCH_DATABASE_PASSWORD:-local-development-only}
    ports: ["5437:5432"]
    volumes: [search-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  order-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketflow_order
      POSTGRES_USER: ${ORDER_DATABASE_USER:-order_app}
      POSTGRES_PASSWORD: ${ORDER_DATABASE_PASSWORD:-local-development-only}
    ports: ["5438:5432"]
    volumes: [order-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic marketflow.identity.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic marketflow.seller.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic marketflow.catalog.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic marketflow.inventory.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic marketflow.order.events.v1 --partitions 3 --replication-factor 1
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.2.7-management
    environment:
      RABBITMQ_DEFAULT_USER: ${MARKETFLOW_RABBITMQ_USER:-marketflow_local}
      RABBITMQ_DEFAULT_PASS: ${MARKETFLOW_RABBITMQ_PASSWORD:-local-development-only}
      RABBITMQ_DEFAULT_VHOST: /marketflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8.2.8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:4.40
    command: ["mini", "-dir=/data", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${MARKETFLOW_OBJECT_STORAGE_ACCESS_KEY:-marketflow_local}
      AWS_SECRET_ACCESS_KEY: ${MARKETFLOW_OBJECT_STORAGE_SECRET_KEY:-local-development-only}
      S3_BUCKET: marketflow-product-media
    ports:
      - "8333:8333"
      - "9333:9333"
      - "23646:23646"
    volumes:
      - object-storage-data:/data
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./platform/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./platform/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      - tempo
    restart: unless-stopped

  sample-service:
    build:
      context: .
      dockerfile: services/sample-service/Dockerfile
    environment:
      MARKETFLOW_ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "8080:8080"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      MARKETFLOW_ENVIRONMENT: local
      SERVER_PORT: 8081
      IDENTITY_DATABASE_URL: jdbc:postgresql://identity-postgres:5432/marketflow_identity
      IDENTITY_DATABASE_USER: ${IDENTITY_DATABASE_USER:-identity_app}
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:-local-development-only}
      IDENTITY_TOKEN_ISSUER: http://identity-service:8081
      IDENTITY_TOKEN_AUDIENCE: marketflow-api
      IDENTITY_INTERNAL_SERVICE_KEY: ${IDENTITY_INTERNAL_SERVICE_KEY:-local-development-only-change-me}
      IDENTITY_RATE_LIMIT_KEY: ${IDENTITY_RATE_LIMIT_KEY:-local-development-only-rate-key}
      IDENTITY_SECURE_COOKIES: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "8081:8081"
    depends_on:
      identity-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  seller-service:
    build:
      context: .
      dockerfile: services/seller-service/Dockerfile
    environment:
      MARKETFLOW_ENVIRONMENT: local
      SERVER_PORT: 8082
      SELLER_DATABASE_URL: jdbc:postgresql://seller-postgres:5432/marketflow_seller
      SELLER_DATABASE_USER: ${SELLER_DATABASE_USER:-seller_app}
      SELLER_DATABASE_PASSWORD: ${SELLER_DATABASE_PASSWORD:-local-development-only}
      IDENTITY_BASE_URL: http://identity-service:8081
      IDENTITY_TOKEN_ISSUER: http://identity-service:8081
      IDENTITY_TOKEN_AUDIENCE: marketflow-api
      IDENTITY_INTERNAL_SERVICE_KEY: ${IDENTITY_INTERNAL_SERVICE_KEY:-local-development-only-change-me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "8082:8082"
    depends_on:
      seller-postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      MARKETFLOW_ENVIRONMENT: local
      SERVER_PORT: 8083
      CATALOG_DATABASE_URL: jdbc:postgresql://catalog-postgres:5432/marketflow_catalog
      CATALOG_DATABASE_USER: ${CATALOG_DATABASE_USER:-catalog_app}
      CATALOG_DATABASE_PASSWORD: ${CATALOG_DATABASE_PASSWORD:-local-development-only}
      IDENTITY_BASE_URL: http://identity-service:8081
      SELLER_BASE_URL: http://seller-service:8082
      IDENTITY_TOKEN_ISSUER: http://identity-service:8081
      IDENTITY_TOKEN_AUDIENCE: marketflow-api
      IDENTITY_INTERNAL_SERVICE_KEY: ${IDENTITY_INTERNAL_SERVICE_KEY:-local-development-only-change-me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["8083:8083"]
    depends_on:
      catalog-postgres: {condition: service_healthy}
      seller-service: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      MARKETFLOW_ENVIRONMENT: local
      SERVER_PORT: 8084
      INVENTORY_DATABASE_URL: jdbc:postgresql://inventory-postgres:5432/marketflow_inventory
      INVENTORY_DATABASE_USER: ${INVENTORY_DATABASE_USER:-inventory_app}
      INVENTORY_DATABASE_PASSWORD: ${INVENTORY_DATABASE_PASSWORD:-local-development-only}
      IDENTITY_BASE_URL: http://identity-service:8081
      SELLER_BASE_URL: http://seller-service:8082
      IDENTITY_TOKEN_ISSUER: http://identity-service:8081
      IDENTITY_TOKEN_AUDIENCE: marketflow-api
      IDENTITY_INTERNAL_SERVICE_KEY: ${IDENTITY_INTERNAL_SERVICE_KEY:-local-development-only-change-me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["8084:8084"]
    depends_on:
      inventory-postgres: {condition: service_healthy}
      seller-service: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    environment:
      MARKETFLOW_ENVIRONMENT: local
      SERVER_PORT: 8085
      SEARCH_DATABASE_URL: jdbc:postgresql://search-postgres:5432/marketflow_search
      SEARCH_DATABASE_USER: ${SEARCH_DATABASE_USER:-search_app}
      SEARCH_DATABASE_PASSWORD: ${SEARCH_DATABASE_PASSWORD:-local-development-only}
      OPENSEARCH_URL: http://opensearch:9200
      CATALOG_BASE_URL: http://catalog-service:8083
      IDENTITY_INTERNAL_SERVICE_KEY: ${IDENTITY_INTERNAL_SERVICE_KEY:-local-development-only-change-me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["8085:8085"]
    depends_on:
      search-postgres: {condition: service_healthy}
      catalog-service: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    environment:
      MARKETFLOW_ENVIRONMENT: local
      SERVER_PORT: 8086
      REDIS_HOST: redis
      IDENTITY_BASE_URL: http://identity-service:8081
      CATALOG_BASE_URL: http://catalog-service:8083
      IDENTITY_TOKEN_ISSUER: http://identity-service:8081
      IDENTITY_TOKEN_AUDIENCE: marketflow-api
      IDENTITY_INTERNAL_SERVICE_KEY: ${IDENTITY_INTERNAL_SERVICE_KEY:-local-development-only-change-me}
      SECURE_COOKIES: "false"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    ports: ["8086:8086"]
    depends_on:
      redis: {condition: service_healthy}
      identity-service: {condition: service_healthy}
      catalog-service: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      MARKETFLOW_ENVIRONMENT: local
      SERVER_PORT: 8087
      ORDER_DATABASE_URL: jdbc:postgresql://order-postgres:5432/marketflow_order
      ORDER_DATABASE_USER: ${ORDER_DATABASE_USER:-order_app}
      ORDER_DATABASE_PASSWORD: ${ORDER_DATABASE_PASSWORD:-local-development-only}
      IDENTITY_BASE_URL: http://identity-service:8081
      CART_BASE_URL: http://cart-service:8086
      CATALOG_BASE_URL: http://catalog-service:8083
      SELLER_BASE_URL: http://seller-service:8082
      INVENTORY_BASE_URL: http://inventory-service:8084
      IDENTITY_TOKEN_ISSUER: http://identity-service:8081
      IDENTITY_TOKEN_AUDIENCE: marketflow-api
      IDENTITY_INTERNAL_SERVICE_KEY: ${IDENTITY_INTERNAL_SERVICE_KEY:-local-development-only-change-me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    ports: ["8087:8087"]
    depends_on:
      order-postgres: {condition: service_healthy}
      cart-service: {condition: service_healthy}
      seller-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./platform/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      sample-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      seller-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_USER: local-admin-disabled
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./platform/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  identity-postgres-data:
  seller-postgres-data:
  catalog-postgres-data:
  inventory-postgres-data:
  search-postgres-data:
  order-postgres-data:
  kafka-data:
  rabbitmq-data:
  redis-data:
  opensearch-data:
  object-storage-data:
  tempo-data:
  prometheus-data:
  grafana-data:
