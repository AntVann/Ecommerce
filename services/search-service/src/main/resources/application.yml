spring:
  application.name: marketflow-search-service
  datasource:
    url: ${SEARCH_DATABASE_URL:jdbc:postgresql://localhost:5437/marketflow_search}
    username: ${SEARCH_DATABASE_USER:search_app}
    password: ${SEARCH_DATABASE_PASSWORD:local-development-only}
  flyway.enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
marketflow.search:
  open-search-url: ${OPENSEARCH_URL:http://localhost:9200}
  catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8083}
  internal-service-key: ${IDENTITY_INTERNAL_SERVICE_KEY:local-development-only-change-me}
  alias: marketflow-products-current
management:
  endpoint.health:
    probes.enabled: true
    group.liveness.include: livenessState,ping
    group.readiness.include: readinessState,db,openSearch
  endpoints.web.exposure.include: health,info,prometheus
  metrics.tags:
    application: ${spring.application.name}
    environment: ${MARKETFLOW_ENVIRONMENT:local}
  opentelemetry.tracing.export.otlp.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing.sampling.probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
logging.structured.format.console: ecs
