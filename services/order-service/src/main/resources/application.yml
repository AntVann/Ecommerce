spring:
  application.name: marketflow-order-service
  datasource:
    url: ${ORDER_DATABASE_URL:jdbc:postgresql://localhost:5438/marketflow_order}
    username: ${ORDER_DATABASE_USER:order_app}
    password: ${ORDER_DATABASE_PASSWORD:local-development-only}
  flyway.enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties.enable.idempotence: true
server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful
marketflow:
  order:
    identity-base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
    identity-issuer: ${IDENTITY_TOKEN_ISSUER:http://identity-service:8081}
    identity-audience: ${IDENTITY_TOKEN_AUDIENCE:marketflow-api}
    cart-base-url: ${CART_BASE_URL:http://localhost:8086}
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8083}
    seller-base-url: ${SELLER_BASE_URL:http://localhost:8082}
    inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8084}
    internal-service-key: ${IDENTITY_INTERNAL_SERVICE_KEY:local-development-only-change-me}
    reservation-ttl-seconds: ${ORDER_RESERVATION_TTL_SECONDS:900}
    payment:
      base-url: ${PAYMENT_BASE_URL:http://localhost:8088}
      internal-service-key: ${PAYMENT_INTERNAL_SERVICE_KEY:local-payment-development-only-change-me}
      unknown-timeout-seconds: ${ORDER_PAYMENT_UNKNOWN_TIMEOUT_SECONDS:900}
management:
  endpoint.health:
    probes.enabled: true
    group.liveness.include: livenessState,ping
    group.readiness.include: readinessState,db
  endpoints.web.exposure.include: health,info,prometheus
  metrics.tags:
    application: ${spring.application.name}
    environment: ${MARKETFLOW_ENVIRONMENT:local}
  opentelemetry.tracing.export.otlp.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing.sampling.probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
logging.structured.format.console: ecs
