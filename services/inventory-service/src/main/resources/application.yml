spring:
  application.name: marketflow-inventory-service
  datasource:
    url: ${INVENTORY_DATABASE_URL:jdbc:postgresql://localhost:5436/marketflow_inventory}
    username: ${INVENTORY_DATABASE_USER:inventory_app}
    password: ${INVENTORY_DATABASE_PASSWORD:local-development-only}
  flyway.enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties.enable.idempotence: true
server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
marketflow.inventory:
  identity-base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
  identity-issuer: ${IDENTITY_TOKEN_ISSUER:http://identity-service:8081}
  identity-audience: ${IDENTITY_TOKEN_AUDIENCE:marketflow-api}
  seller-base-url: ${SELLER_BASE_URL:http://localhost:8082}
  internal-service-key: ${IDENTITY_INTERNAL_SERVICE_KEY:local-development-only-change-me}
management:
  endpoint.health:
    probes.enabled: true
    group.liveness.include: livenessState,ping
    group.readiness.include: readinessState,db
  endpoints.web.exposure.include: health,info,prometheus
  metrics.tags:
    application: ${spring.application.name}
    environment: ${MARKETFLOW_ENVIRONMENT:local}
  opentelemetry.tracing.export.otlp.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing.sampling.probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
logging.structured.format.console: ecs
