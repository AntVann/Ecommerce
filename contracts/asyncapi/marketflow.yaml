asyncapi: 3.0.0
info:
  title: MarketFlow Event Contracts
  version: 1.0.0
  description: >-
    Versioned Identity, Seller, Catalog, Inventory, Order, and Payment events using the shared MarketFlow envelope.
defaultContentType: application/json
channels:
  identityEvents:
    address: marketflow.identity.events.v1
    messages:
      userRegistered: {$ref: "#/components/messages/UserRegistered"}
      userDisabled: {$ref: "#/components/messages/UserDisabled"}
  sellerEvents:
    address: marketflow.seller.events.v1
    messages:
      sellerApproved: {$ref: "#/components/messages/SellerApproved"}
      sellerRejected: {$ref: "#/components/messages/SellerRejected"}
      sellerSuspended: {$ref: "#/components/messages/SellerSuspended"}
  catalogEvents:
    address: marketflow.catalog.events.v1
    messages:
      productPublished: {$ref: "#/components/messages/ProductPublished"}
      productUpdated: {$ref: "#/components/messages/ProductUpdated"}
      productDeactivated: {$ref: "#/components/messages/ProductDeactivated"}
      priceChanged: {$ref: "#/components/messages/PriceChanged"}
  inventoryEvents:
    address: marketflow.inventory.events.v1
    messages:
      inventoryAdjusted: {$ref: "#/components/messages/InventoryAdjusted"}
      inventoryReserved: {$ref: "#/components/messages/InventoryReserved"}
      inventoryReservationFailed: {$ref: "#/components/messages/InventoryReservationFailed"}
      inventoryReleased: {$ref: "#/components/messages/InventoryReleased"}
      inventoryReservationConfirmed: {$ref: "#/components/messages/InventoryReservationConfirmed"}
      inventoryReservationReleased: {$ref: "#/components/messages/InventoryReservationReleased"}
  orderEvents:
    address: marketflow.order.events.v1
    messages:
      orderCreated: {$ref: "#/components/messages/OrderCreated"}
      orderConfirmed: {$ref: "#/components/messages/OrderConfirmed"}
      orderPaymentFailed: {$ref: "#/components/messages/OrderPaymentFailed"}
      inventoryConfirmationRequested: {$ref: "#/components/messages/InventoryConfirmationRequested"}
      inventoryReleaseRequested: {$ref: "#/components/messages/InventoryReleaseRequested"}
      manualReviewRequired: {$ref: "#/components/messages/ManualReviewRequired"}
  paymentEvents:
    address: marketflow.payment.events.v1
    messages:
      paymentAuthorized: {$ref: "#/components/messages/PaymentAuthorized"}
      paymentDeclined: {$ref: "#/components/messages/PaymentDeclined"}
      paymentFailed: {$ref: "#/components/messages/PaymentFailed"}
      paymentUnknown: {$ref: "#/components/messages/PaymentUnknown"}
operations:
  publishIdentityEvents:
    action: send
    channel: {$ref: "#/channels/identityEvents"}
  publishSellerEvents:
    action: send
    channel: {$ref: "#/channels/sellerEvents"}
  publishCatalogEvents:
    action: send
    channel: {$ref: "#/channels/catalogEvents"}
  publishInventoryEvents:
    action: send
    channel: {$ref: "#/channels/inventoryEvents"}
  publishOrderEvents:
    action: send
    channel: {$ref: "#/channels/orderEvents"}
  publishPaymentEvents:
    action: send
    channel: {$ref: "#/channels/paymentEvents"}
  inventoryConsumesOrderEvents:
    action: receive
    channel: {$ref: "#/channels/orderEvents"}
  orderConsumesInventoryEvents:
    action: receive
    channel: {$ref: "#/channels/inventoryEvents"}
  orderConsumesPaymentEvents:
    action: receive
    channel: {$ref: "#/channels/paymentEvents"}
components:
  messages:
    UserRegistered:
      name: identity.user-registered.v1
      payload: {$ref: "../events/identity.user-registered.v1.schema.json"}
    UserDisabled:
      name: identity.user-disabled.v1
      payload: {$ref: "../events/identity.user-disabled.v1.schema.json"}
    SellerApproved:
      name: seller.seller-approved.v1
      payload: {$ref: "../events/seller.seller-approved.v1.schema.json"}
    SellerRejected:
      name: seller.seller-rejected.v1
      payload: {$ref: "../events/seller.seller-rejected.v1.schema.json"}
    SellerSuspended:
      name: seller.seller-suspended.v1
      payload: {$ref: "../events/seller.seller-suspended.v1.schema.json"}
    ProductPublished:
      name: catalog.product-published.v1
      payload: {$ref: "../events/catalog.product-published.v1.schema.json"}
    ProductUpdated:
      name: catalog.product-updated.v1
      payload: {$ref: "../events/catalog.product-updated.v1.schema.json"}
    ProductDeactivated:
      name: catalog.product-deactivated.v1
      payload: {$ref: "../events/catalog.product-deactivated.v1.schema.json"}
    PriceChanged:
      name: catalog.price-changed.v1
      payload: {$ref: "../events/catalog.price-changed.v1.schema.json"}
    InventoryAdjusted:
      name: inventory.inventory-adjusted.v1
      payload: {$ref: "../events/inventory.inventory-adjusted.v1.schema.json"}
    InventoryReserved:
      name: inventory.inventory-reserved.v1
      payload: {$ref: "../events/inventory.inventory-reserved.v1.schema.json"}
    InventoryReservationFailed:
      name: inventory.inventory-reservation-failed.v1
      payload: {$ref: "../events/inventory.inventory-reservation-failed.v1.schema.json"}
    InventoryReleased:
      name: inventory.inventory-released.v1
      payload: {$ref: "../events/inventory.inventory-released.v1.schema.json"}
    InventoryReservationConfirmed:
      name: inventory.inventory-reservation-confirmed.v1
      payload: {$ref: "../events/inventory.inventory-reservation-confirmed.v1.schema.json"}
    InventoryReservationReleased:
      name: inventory.inventory-reservation-released.v1
      payload: {$ref: "../events/inventory.inventory-reservation-released.v1.schema.json"}
    OrderCreated:
      name: order.order-created.v1
      payload: {$ref: "../events/order.order-created.v1.schema.json"}
    OrderConfirmed:
      name: order.order-confirmed.v1
      payload: {$ref: "../events/order.order-confirmed.v1.schema.json"}
    OrderPaymentFailed:
      name: order.order-payment-failed.v1
      payload: {$ref: "../events/order.order-payment-failed.v1.schema.json"}
    InventoryConfirmationRequested:
      name: order.inventory-confirmation-requested.v1
      payload: {$ref: "../events/order.inventory-confirmation-requested.v1.schema.json"}
    InventoryReleaseRequested:
      name: order.inventory-release-requested.v1
      payload: {$ref: "../events/order.inventory-release-requested.v1.schema.json"}
    ManualReviewRequired:
      name: order.manual-review-required.v1
      payload: {$ref: "../events/order.manual-review-required.v1.schema.json"}
    PaymentAuthorized:
      name: payment.payment-authorized.v1
      payload: {$ref: "../events/payment.payment-authorized.v1.schema.json"}
    PaymentDeclined:
      name: payment.payment-declined.v1
      payload: {$ref: "../events/payment.payment-declined.v1.schema.json"}
    PaymentFailed:
      name: payment.payment-failed.v1
      payload: {$ref: "../events/payment.payment-failed.v1.schema.json"}
    PaymentUnknown:
      name: payment.payment-unknown.v1
      payload: {$ref: "../events/payment.payment-unknown.v1.schema.json"}
  schemas:
    EventEnvelope:
      $ref: "../events/event-envelope.v1.schema.json"
