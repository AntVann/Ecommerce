openapi: 3.1.0
info:
  title: MarketFlow Order and Checkout API
  version: 1.0.0
  description: Idempotent checkout and the initial inventory-reservation order Saga.
servers: [{url: "http://localhost:8087"}]
security: [{bearerAuth: []}]
paths:
  /api/v1/checkouts:
    post:
      summary: Validate a cart and create an immutable pending order
      operationId: submitCheckout
      parameters: [{$ref: "./common-components.yaml#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CheckoutRequest"}}}}
      responses:
        "202": {description: Checkout accepted, headers: {Location: {schema: {type: string, format: uri-reference}}}, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/orders/{orderId}:
    get:
      summary: Get a customer-owned order
      operationId: getOrder
      parameters: [{$ref: "#/components/parameters/OrderId"}]
      responses: {"200": {description: Order, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}, "404": {$ref: "#/components/responses/Problem"}}
  /api/v1/orders:
    get:
      summary: List customer-owned orders with stable cursor pagination
      operationId: listCustomerOrders
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Customer order page, content: {application/json: {schema: {$ref: "#/components/schemas/OrderPage"}}}}}
  /api/v1/orders/{orderId}/payment-authorizations:
    post:
      summary: Idempotently initiate fake-token payment authorization for an inventory-reserved order
      operationId: authorizeOrderPayment
      parameters: [{$ref: "#/components/parameters/OrderId"}, {$ref: "./common-components.yaml#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentAuthorizationRequest"}}}}
      responses: {"202": {description: Authorization accepted, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}, "404": {$ref: "#/components/responses/Problem"}, "409": {$ref: "#/components/responses/Problem"}}
  /api/v1/orders/{orderId}/history:
    get:
      summary: List the immutable status history of a customer-owned order
      operationId: getOrderStatusHistory
      parameters: [{$ref: "#/components/parameters/OrderId"}]
      responses: {"200": {description: Status history, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/OrderStatusHistory"}}}}}, "404": {$ref: "#/components/responses/Problem"}}
  /api/v1/sellers/{sellerId}/orders:
    get:
      summary: List orders containing lines owned by an authorized seller
      operationId: listSellerOrders
      parameters: [{$ref: "#/components/parameters/SellerId"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Seller-filtered order page, content: {application/json: {schema: {$ref: "#/components/schemas/SellerOrderPage"}}}}, "403": {$ref: "#/components/responses/Problem"}}
  /api/v1/sellers/{sellerId}/orders/{orderId}:
    get:
      summary: Get one seller-filtered order
      operationId: getSellerOrder
      parameters: [{$ref: "#/components/parameters/SellerId"}, {$ref: "#/components/parameters/OrderId"}]
      responses: {"200": {description: Seller-filtered order, content: {application/json: {schema: {$ref: "#/components/schemas/SellerOrder"}}}}, "404": {$ref: "#/components/responses/Problem"}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    OrderId: {name: orderId, in: path, required: true, schema: {$ref: "./common-components.yaml#/components/schemas/Identifier"}}
    SellerId: {name: sellerId, in: path, required: true, schema: {$ref: "./common-components.yaml#/components/schemas/Identifier"}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string, maxLength: 512}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
  responses:
    Problem: {description: RFC 9457 problem details, content: {application/problem+json: {schema: {$ref: "./problem-details.yaml#/components/schemas/ProblemDetails"}}}}
  schemas:
    Address:
      type: object
      required: [recipientName, addressLine1, city, postalCode, countryCode]
      properties: {recipientName: {type: string, minLength: 1, maxLength: 160}, addressLine1: {type: string, minLength: 1, maxLength: 200}, addressLine2: {type: [string, "null"], maxLength: 200}, city: {type: string, minLength: 1, maxLength: 120}, region: {type: [string, "null"], maxLength: 120}, postalCode: {type: string, minLength: 1, maxLength: 32}, countryCode: {type: string, pattern: "^[A-Z]{2}$"}}
      additionalProperties: false
    CheckoutRequest: {type: object, required: [cartId, cartVersion, shippingAddress, billingAddress], properties: {cartId: {$ref: "./common-components.yaml#/components/schemas/Identifier"}, cartVersion: {type: integer, minimum: 1}, shippingAddress: {$ref: "#/components/schemas/Address"}, billingAddress: {$ref: "#/components/schemas/Address"}}, additionalProperties: false}
    PaymentAuthorizationRequest: {type: object, required: [fakePaymentToken], properties: {fakePaymentToken: {type: string, pattern: "^mf_fake_(approve|decline|timeout|delayed_approve|delayed_decline|duplicate)$"}}, additionalProperties: false}
    OrderItem: {type: object, required: [sellerId, productId, variantId, productName, variantName, sku, quantity, unitPrice, lineSubtotal, catalogVersion], properties: {sellerId: {$ref: "./common-components.yaml#/components/schemas/Identifier"}, productId: {$ref: "./common-components.yaml#/components/schemas/Identifier"}, variantId: {$ref: "./common-components.yaml#/components/schemas/Identifier"}, productName: {type: string}, variantName: {type: string}, sku: {type: string}, quantity: {type: integer, minimum: 1, maximum: 99}, unitPrice: {$ref: "./common-components.yaml#/components/schemas/Money"}, lineSubtotal: {$ref: "./common-components.yaml#/components/schemas/Money"}, catalogVersion: {type: integer, minimum: 1}}, additionalProperties: false}
    Order:
      type: object
      required: [orderId, customerId, cartId, cartVersion, status, items, subtotal, grandTotal, shippingAddress, billingAddress, version, createdAt]
      properties:
        orderId: {$ref: "./common-components.yaml#/components/schemas/Identifier"}
        customerId: {$ref: "./common-components.yaml#/components/schemas/Identifier"}
        cartId: {$ref: "./common-components.yaml#/components/schemas/Identifier"}
        cartVersion: {type: integer, minimum: 1}
        status: {type: string, enum: [PENDING, INVENTORY_RESERVED, PAYMENT_PROCESSING, CONFIRMED, PAYMENT_FAILED, CANCELLED, MANUAL_REVIEW]}
        paymentId: {anyOf: [{$ref: "./common-components.yaml#/components/schemas/Identifier"}, {type: "null"}]}
        paymentState: {type: [string, "null"], enum: [PROCESSING, AUTHORIZED, DECLINED, FAILED, UNKNOWN, null]}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: "#/components/schemas/OrderItem"}}
        subtotal: {$ref: "./common-components.yaml#/components/schemas/Money"}
        grandTotal: {$ref: "./common-components.yaml#/components/schemas/Money"}
        shippingAddress: {$ref: "#/components/schemas/Address"}
        billingAddress: {$ref: "#/components/schemas/Address"}
        version: {type: integer, minimum: 1}
        createdAt: {$ref: "./common-components.yaml#/components/schemas/UtcTimestamp"}
      additionalProperties: false
    OrderPage: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Order"}}, nextCursor: {type: [string, "null"]}}, additionalProperties: false}
    OrderStatusHistory: {type: object, required: [newStatus, occurredAt], properties: {previousStatus: {type: [string, "null"]}, newStatus: {type: string}, reason: {type: [string, "null"], maxLength: 80}, occurredAt: {$ref: "./common-components.yaml#/components/schemas/UtcTimestamp"}}, additionalProperties: false}
    SellerOrder:
      type: object
      required: [id, status, currency, sellerSubtotal, createdAt, updatedAt, items]
      properties:
        id: {$ref: "./common-components.yaml#/components/schemas/Identifier"}
        status: {type: string, enum: [PENDING, INVENTORY_RESERVED, PAYMENT_PROCESSING, CONFIRMED, PAYMENT_FAILED, CANCELLED, MANUAL_REVIEW]}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        sellerSubtotal: {type: number, minimum: 0, multipleOf: 0.0001}
        createdAt: {$ref: "./common-components.yaml#/components/schemas/UtcTimestamp"}
        updatedAt: {$ref: "./common-components.yaml#/components/schemas/UtcTimestamp"}
        items: {type: array, minItems: 1, items: {$ref: "#/components/schemas/OrderItem"}}
      additionalProperties: false
    SellerOrderPage: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/SellerOrder"}}, nextCursor: {type: [string, "null"]}}, additionalProperties: false}
