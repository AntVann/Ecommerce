openapi: 3.1.0
info: {title: MarketFlow Search API, version: 1.0.0, description: Rebuildable non-authoritative product search projection.}
servers: [{url: "http://localhost:8085"}]
security: []
paths:
  /api/v1/products:
    get:
      summary: Search published products
      operationId: searchProducts
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: categoryId, in: query, schema: {$ref: "./common-components.yaml#/components/schemas/Identifier"}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses: {"200": {description: Search results and facets}, "503": {description: Search projection unavailable}}
