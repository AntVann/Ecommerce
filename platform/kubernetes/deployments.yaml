apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
  namespace: marketflow-local
  labels: &service-labels
    app.kubernetes.io/part-of: marketflow
    app.kubernetes.io/component: service
    app.kubernetes.io/name: sample-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app.kubernetes.io/name: sample-service}}
  template:
    metadata: {labels: {app.kubernetes.io/name: sample-service, app.kubernetes.io/part-of: marketflow}}
    spec:
      serviceAccountName: marketflow-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sample-service
          image: marketflow/sample-service:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: marketflow-runtime}
            - secretRef: {name: marketflow-runtime-secrets, optional: true}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 10, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 20, timeoutSeconds: 3}
          lifecycle: {preStop: {exec: {command: ["/bin/sh", "-c", "sleep 10"]}}}
---
