{{- range $name, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "marketflow.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: marketflow}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $name }}
          image: {{ include "marketflow.image" (dict "registry" $.Values.imageRegistry "name" $name "tag" $.Values.imageTag) | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports: [{name: http, containerPort: {{ $service.port }}}]
          env:
            - {name: SERVER_PORT, value: {{ $service.port | quote }}}
          envFrom:
            - configMapRef: {name: {{ include "marketflow.fullname" $ }}-runtime}
            - secretRef: {name: {{ $.Values.secretName }}, optional: true}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 10, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 20, timeoutSeconds: 3}
          lifecycle: {preStop: {exec: {command: ["/bin/sh", "-c", "sleep 15"]}}}
{{- end }}
