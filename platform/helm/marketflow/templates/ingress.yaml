{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "marketflow.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "marketflow.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls.enabled }}
  tls: [{hosts: [{{ .Values.tls.host }}], secretName: {{ .Values.tls.secretName }}}]
  {{- end }}
  rules:
    - host: {{ .Values.tls.host }}
      http:
        paths:
          - {path: /api/v1/auth, pathType: Prefix, backend: {service: {name: identity-service, port: {name: http}}}}
          - {path: /api/v1/admin/users, pathType: Prefix, backend: {service: {name: identity-service, port: {name: http}}}}
          - {path: /api/v1/seller-applications, pathType: Prefix, backend: {service: {name: seller-service, port: {name: http}}}}
          - {path: /api/v1/admin/seller-applications, pathType: Prefix, backend: {service: {name: seller-service, port: {name: http}}}}
          - {path: /api/v1/admin/sellers, pathType: Prefix, backend: {service: {name: seller-service, port: {name: http}}}}
          - {path: /api/v1/products, pathType: Prefix, backend: {service: {name: search-service, port: {name: http}}}}
          - {path: /api/v1/sellers, pathType: Prefix, backend: {service: {name: seller-service, port: {name: http}}}}
          - {path: /api/v1/cart, pathType: Prefix, backend: {service: {name: cart-service, port: {name: http}}}}
          - {path: /api/v1/checkouts, pathType: Prefix, backend: {service: {name: order-service, port: {name: http}}}}
          - {path: /api/v1/orders, pathType: Prefix, backend: {service: {name: order-service, port: {name: http}}}}
          - {path: /api/v1/notifications, pathType: Prefix, backend: {service: {name: notification-service, port: {name: http}}}}
{{- end }}
