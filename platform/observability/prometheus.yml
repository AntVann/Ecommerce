global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: sample-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sample-service:8080"]

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8081"]

  - job_name: seller-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["seller-service:8082"]

  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-service:8083"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8084"]

  - job_name: search-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["search-service:8085"]
