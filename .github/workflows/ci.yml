name: MarketFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "milestone/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java build and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Maven reactor
        run: |
          chmod +x mvnw scripts/*.sh
          ./mvnw -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/target/*-reports/**"
          if-no-files-found: ignore

  contracts:
    name: Contract lint and schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install pinned validators
        run: npm ci --ignore-scripts
      - name: Validate contracts
        run: npm run lint

  compose:
    name: Compose configuration and service smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Render Compose configuration
        run: docker compose config --quiet
      - name: Start MarketFlow environment
        run: docker compose up -d --build --wait
      - name: Run health and telemetry smoke checks
        run: |
          chmod +x scripts/smoke-infra.sh
          ./scripts/smoke-infra.sh
      - name: Collect diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop MarketFlow environment
        if: always()
        run: docker compose down

  security:
    name: Secret, dependency, filesystem, and SAST scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan filesystem vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: java-kotlin
      - name: Build for CodeQL
        uses: github/codeql-action/autobuild@v4.37.7
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
